name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        if: matrix.language == 'java-kotlin'
        run: npm ci --legacy-peer-deps

      - name: Build the app's web files
        if: matrix.language == 'java-kotlin'
        env:
          SYRIUS_PLATFORM: android
        run: npm run build

      - name: Generate the Capacitor Android inputs
        if: matrix.language == 'java-kotlin'
        run: |
          npx cap sync android
          test -f android/capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile the Android app
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          (cd android && ./gradlew --no-daemon --no-build-cache assembleDebug)

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif-results

      - name: Drop results in third-party packages
        shell: bash
        run: |
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do
            # A vendor primary location can still have a first-party path.
            # Keep missing or unresolved locations conservatively.
            jq '.runs |= map(.results |= map(select(
              ([.locations[]?, .relatedLocations[]?,
                .codeFlows[]?.threadFlows[]?.locations[]?.location?,
                .stacks[]?.frames[]?.location?]
                | map(.physicalLocation.artifactLocation.uri // "")) as $uris
              | ((.locations // [] | length > 0) and ($uris | all(startswith("node_modules/"))))
              | not)))' "$file" > "$file.kept"
            echo "$file: $(jq '[.runs[].results[]] | length' "$file") results, $(jq '[.runs[].results[]] | length' "$file.kept") kept"
            mv "$file.kept" "$file"
          done

      - name: Upload results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
