name: Build and package extension

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - development
      - manifest-v3
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      attach_to:
        description: 'Add packages to this existing release (its tag, e.g. v0.3.6)'
        required: false
        default: ''
      platforms:
        description: 'Which packages to add'
        type: choice
        options: [all, ios, android, firefox]
        default: all

permissions:
  contents: read

# A run that publishes: a tag, the automatic release branch, or an attach run.
# Only these sign the Android app and the Firefox add-on. Each platform builds,
# signs and publishes on its own, so one that fails, or that Mozilla is still
# holding, does not keep the others out of a release.
env:
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.attach_to != '') }}

concurrency:
  group: extension-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Chrome/Brave package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      manifest_version: ${{ steps.metadata.outputs.manifest_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check toolchain
        run: |
          node --version
          npm --version

      - name: Validate project versions
        id: metadata
        shell: bash
        run: |
          manifest_version="$(node -p "require('./src/manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$manifest_version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Invalid Chrome manifest version: $manifest_version"
            exit 1
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid npm package version: $package_version"
            exit 1
          fi

          if [[ "$manifest_version" != "$package_version" ]]; then
            echo "::error::The Chrome manifest version ($manifest_version) must match the npm package version ($package_version)."
            exit 1
          fi

          printf 'manifest_version=%s\n' "$manifest_version" >> "$GITHUB_OUTPUT"
          printf 'package_version=%s\n' "$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.metadata.outputs.manifest_version }}
        shell: bash
        run: |
          expected_tag="v${MANIFEST_VERSION}"
          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $TAG_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint source
        run: npm run lint

      - name: Check out pinned embedded ABI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zenon-network/go-zenon
          ref: 667a69d9e9a418edf7580b08492ba5dcb9efd63a
          path: .test-fixtures/go-zenon
          sparse-checkout: vm/embedded/definition
          persist-credentials: false

      - name: Run focused regression tests
        env:
          GO_ZENON_ABI_DIR: .test-fixtures/go-zenon/vm/embedded/definition
        run: npm test

      - name: Check validation failure paths
        env:
          GO_ZENON_ABI_DIR: .test-fixtures/go-zenon/vm/embedded/definition
        run: node --test utils/validation-gates-test.js

      - name: Check release publication failure paths
        run: node --test utils/release-assets-test.js

      # The build refuses to package when a pinned notice source drifts; this
      # is the check that the refusal itself still works.
      - name: Check third-party notice generation
        run: node utils/third-party-readme-notices-test.js

      - name: Test Firefox asset-size failure reporting
        run: node utils/firefox-build-test.js

      - name: Run dependency security regression tests
        run: npm run test:security

      - name: Run native browser regression tests
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_path"
          "$browser_path" --version
          # Firefox too when the runner has it: proof of work is checked there
          # (docs/testing/POW-TEST.md).
          firefox_path="$(command -v firefox || true)"
          CHROMIUM_PATH="$browser_path" FIREFOX_PATH="$firefox_path" npm run test:browser

      - name: Build production extension
        run: npm run build

      # Every other browser fixture substitutes the SDK boundary, which is how
      # wallet removal stayed broken in production builds while they all passed.
      # This one drives the package just built, with its real Argon2/AES path,
      # and includes an unshortened five-minute session expiry.
      - name: Check production keyfile lifecycle
        timeout-minutes: 15
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_path"
          CHROMIUM_PATH="$browser_path" SYRIUS_EXTENSION_DIR="$PWD/build" \
            node utils/keyfile-lifecycle-browser-test.js

      - name: Validate and package production build
        id: package
        env:
          MANIFEST_VERSION: ${{ steps.metadata.outputs.manifest_version }}
        shell: bash
        run: |
          test -f build/manifest.json

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('build/manifest.json', 'utf8'));

          if (manifest.manifest_version !== 3) {
            throw new Error('The production manifest is not Manifest V3.');
          }

          if (manifest.version !== process.env.MANIFEST_VERSION) {
            throw new Error('The production manifest version does not match the source manifest.');
          }
          NODE

          if find build -type f \( -name '*.map' -o -iname 'desktop.ini' -o -iname 'dekstop.ini' -o -iname 'thumbs.db' -o -iname 'ehthumbs.db' \) -print -quit | grep -q .; then
            echo "::error::The production package contains source maps or OS metadata."
            exit 1
          fi

          archive="syrius-extension-${MANIFEST_VERSION}-chrome-brave.zip"
          (cd build && zip -qr "../${archive}" .)

          if ! unzip -Z1 "$archive" | grep -qx 'manifest.json'; then
            echo "::error::The ZIP does not contain manifest.json at its root."
            exit 1
          fi

          sha256sum "$archive" > "${archive}.sha256"
          printf 'archive_name=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Attest Chrome/Brave release package
        if: env.RELEASING == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive_name }}

      - name: Upload direct Chrome/Brave package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 30
          archive: false

  # The iOS app, unsigned. CI cannot sign it: a free Apple ID signs only from
  # the person's own machine or phone, for seven days. SideStore or AltStore
  # sign it on install and renew it there (README, iOS).
  ios:
    name: Build iOS app (unsigned IPA)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      ipa: ${{ steps.package.outputs.ipa }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check toolchain
        run: |
          node --version
          xcodebuild -version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the app's web files
        env:
          SYRIUS_PLATFORM: ios
        run: npm run build

      - name: Copy them into the iOS project
        run: npx cap sync ios

      # Version and build number as Android's: 0.3.6 is 306.
      - name: Build and package
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          build="$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")"
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$build"

          app="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/App.app"
          test -f "$app/Info.plist"
          test -f "$app/public/index.html"

          # An IPA is the app in a Payload folder, zipped.
          ipa="syrius-${version}-ios-unsigned.ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$ipa" Payload)
          printf 'ipa=%s\n' "$ipa" >> "$GITHUB_OUTPUT"

      - name: Attest iOS release package
        if: env.RELEASING == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.ipa }}

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30
          archive: false

  # The Android app. A release is signed with the project's key, which only a
  # tag or an attach run is given; every other run builds the debug APK, to
  # show the project still compiles, and keeps nothing.
  android:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    # No file-name output: GitHub drops an output that contains a secret's
    # value, and the key alias is part of the name. The publish job derives it.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the app's web files
        env:
          SYRIUS_PLATFORM: android
        run: npm run build

      - name: Copy them into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        if: env.RELEASING != 'true'
        working-directory: android
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon assembleDebug

      - name: Build and sign the release APK
        id: package
        if: env.RELEASING == 'true' && inputs.platforms != 'ios' && inputs.platforms != 'firefox'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SYRIUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SYRIUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SYRIUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$SYRIUS_KEYSTORE_PASSWORD" || -z "$SYRIUS_KEY_ALIAS" || -z "$SYRIUS_KEY_PASSWORD" ]]; then
            echo "::error::The Android signing secrets are not set."
            exit 1
          fi
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export SYRIUS_KEYSTORE="$RUNNER_TEMP/syrius-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SYRIUS_KEYSTORE"
          trap 'rm -f "$SYRIUS_KEYSTORE"' EXIT

          (cd android && ./gradlew --no-daemon assembleRelease)

          version="$(node -p "require('./package.json').version")"
          apk="syrius-${version}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"

          # Signed, and with the release key: an unsigned or debug-signed APK
          # would not install over the last release.
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apk-certs.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apk-certs.txt"; then
            echo "::error::The APK is signed with a debug key."
            exit 1
          fi
          printf 'apk=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Attest Android release package
        if: env.RELEASING == 'true' && inputs.platforms != 'ios' && inputs.platforms != 'firefox'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.apk }}

      - name: Upload Android app artifact
        if: env.RELEASING == 'true' && inputs.platforms != 'ios' && inputs.platforms != 'firefox'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
          archive: false

  # The Firefox add-on. Firefox installs only an add-on Mozilla has signed, so a
  # release sends the package to addons.mozilla.org for an unlisted signature;
  # that happens once per version, on a tag or an attach run only. Every other
  # run builds and lints the package and keeps nothing.
  firefox:
    name: Build Firefox add-on
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the add-on
        env:
          SYRIUS_PLATFORM: firefox
        run: npm run build

      # Self-hosted: the add-on names its own update_url, which a listed one may not.
      - name: Lint it as addons.mozilla.org does
        run: npx --yes web-ext@10.7.0 lint --self-hosted --source-dir build-firefox

      - name: Sign it and write the update manifest
        id: package
        if: env.RELEASING == 'true' && inputs.platforms != 'ios' && inputs.platforms != 'android'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        shell: bash
        run: |
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "::error::The addons.mozilla.org signing secrets are not set."
            exit 1
          fi
          npx --yes web-ext@10.7.0 sign --channel unlisted --source-dir build-firefox \
            --artifacts-dir "$RUNNER_TEMP/signed" --approval-timeout 1500000

          version="$(node -p "require('./build-firefox/manifest.json').version")"
          xpi="syrius-extension-${version}-firefox.xpi"
          mapfile -t signed < <(find "$RUNNER_TEMP/signed" -maxdepth 1 -type f -name '*.xpi')
          if (( ${#signed[@]} != 1 )); then
            echo "::error::Expected one signed add-on, found ${#signed[@]}."
            exit 1
          fi
          cp "${signed[0]}" "$xpi"
          unzip -Z1 "$xpi" | grep -q '^META-INF/mozilla.rsa$'

          # What an installed add-on reads to find its next version (the
          # manifest's update_url is this file on the latest release).
          XPI="$xpi" VERSION="$version" REPOSITORY="$GITHUB_REPOSITORY" node utils/firefox-updates.js
          printf 'xpi=%s\n' "$xpi" >> "$GITHUB_OUTPUT"

      - name: Attest Firefox release package
        if: env.RELEASING == 'true' && inputs.platforms != 'ios' && inputs.platforms != 'android'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.xpi }}

      - name: Upload Firefox add-on artifact
        if: env.RELEASING == 'true' && inputs.platforms != 'ios' && inputs.platforms != 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.xpi }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload Firefox update manifest artifact
        if: env.RELEASING == 'true' && inputs.platforms != 'ios' && inputs.platforms != 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-updates.json
          path: updates.json
          if-no-files-found: error
          retention-days: 30
          archive: false

  # Adds the iOS app to the release: after the release job on a tag, or by
  # hand (workflow_dispatch, attach_to: the tag, platforms: ios or all) to a
  # release published without it. It never replaces a file the release has.
  publish-ios:
    name: Publish iOS app
    if: >-
      always() && needs.build.result == 'success' && needs.ios.result == 'success' && (
        needs.release.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.attach_to != '' &&
          (inputs.platforms == 'all' || inputs.platforms == 'ios')))
    needs: [build, ios, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download iOS app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.ios.outputs.ipa }}
          path: release-assets
          skip-decompress: true

      - name: Add it to the release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.manifest_version)) }}
          MANIFEST_VERSION: ${{ needs.build.outputs.manifest_version }}
          IPA: ${{ needs.ios.outputs.ipa }}
        shell: bash
        run: |
          if [[ "$TAG_NAME" != "v${MANIFEST_VERSION}" ]]; then
            echo "::error::This checkout is ${MANIFEST_VERSION}; it cannot add packages to $TAG_NAME."
            exit 1
          fi
          test "$IPA" = "syrius-${MANIFEST_VERSION}-ios-unsigned.ipa" && test -f "$IPA"
          sha256sum "$IPA" > "${IPA}.sha256"
          assets=("$IPA" "${IPA}.sha256")

          existing="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            if grep -qxF "$asset" <<< "$existing"; then
              echo "::error::Release $TAG_NAME already has $asset."
              exit 1
            fi
          done
          gh release upload "$TAG_NAME" "${assets[@]}"

  # Adds the Android app to the release: after the release job on a tag, or by
  # hand (workflow_dispatch, attach_to: the tag, platforms: android or all) to a
  # release published without it. It never replaces a file the release has.
  publish-android:
    name: Publish Android app
    if: >-
      always() && needs.build.result == 'success' && needs.android.result == 'success' && (
        needs.release.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.attach_to != '' &&
          (inputs.platforms == 'all' || inputs.platforms == 'android')))
    needs: [build, android, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Android app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syrius-${{ needs.build.outputs.manifest_version }}-android.apk
          path: release-assets
          skip-decompress: true

      - name: Add it to the release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.manifest_version)) }}
          MANIFEST_VERSION: ${{ needs.build.outputs.manifest_version }}
          APK: syrius-${{ needs.build.outputs.manifest_version }}-android.apk
        shell: bash
        run: |
          if [[ "$TAG_NAME" != "v${MANIFEST_VERSION}" ]]; then
            echo "::error::This checkout is ${MANIFEST_VERSION}; it cannot add packages to $TAG_NAME."
            exit 1
          fi
          test "$APK" = "syrius-${MANIFEST_VERSION}-android.apk" && test -f "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          assets=("$APK" "${APK}.sha256")

          existing="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            if grep -qxF "$asset" <<< "$existing"; then
              echo "::error::Release $TAG_NAME already has $asset."
              exit 1
            fi
          done
          gh release upload "$TAG_NAME" "${assets[@]}"

  # Adds the Firefox add-on to the release: after the release job on a tag, or by
  # hand (workflow_dispatch, attach_to: the tag, platforms: firefox or all) to a
  # release published without it. It never replaces a file the release has.
  publish-firefox:
    name: Publish Firefox add-on
    if: >-
      always() && needs.build.result == 'success' && needs.firefox.result == 'success' && (
        needs.release.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.attach_to != '' &&
          (inputs.platforms == 'all' || inputs.platforms == 'firefox')))
    needs: [build, firefox, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Firefox add-on
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syrius-extension-${{ needs.build.outputs.manifest_version }}-firefox.xpi
          path: release-assets
          skip-decompress: true

      - name: Download Firefox update manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firefox-updates.json
          path: release-assets
          skip-decompress: true

      - name: Add it to the release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.manifest_version)) }}
          MANIFEST_VERSION: ${{ needs.build.outputs.manifest_version }}
          XPI: syrius-extension-${{ needs.build.outputs.manifest_version }}-firefox.xpi
        shell: bash
        run: |
          if [[ "$TAG_NAME" != "v${MANIFEST_VERSION}" ]]; then
            echo "::error::This checkout is ${MANIFEST_VERSION}; it cannot add packages to $TAG_NAME."
            exit 1
          fi
          test "$XPI" = "syrius-extension-${MANIFEST_VERSION}-firefox.xpi" && test -f "$XPI" && test -f updates.json
          sha256sum "$XPI" > "${XPI}.sha256"
          assets=("$XPI" "${XPI}.sha256" updates.json)

          existing="$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            if grep -qxF "$asset" <<< "$existing"; then
              echo "::error::Release $TAG_NAME already has $asset."
              exit 1
            fi
          done
          gh release upload "$TAG_NAME" "${assets[@]}"

  # Creates the release with the Chrome/Brave package. The other platforms add
  # theirs to it (publish-ios, publish-android, publish-firefox).
  release:
    name: Publish GitHub release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Chrome/Brave package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syrius-extension-${{ needs.build.outputs.manifest_version }}-chrome-brave.zip
          path: release-assets
          skip-decompress: true

      - name: Recreate release checksum
        working-directory: release-assets
        env:
          MANIFEST_VERSION: ${{ needs.build.outputs.manifest_version }}
        shell: bash
        run: |
          archive="syrius-extension-${MANIFEST_VERSION}-chrome-brave.zip"
          test -f "$archive"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTO_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.manifest_version) }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          # The Chrome/Brave ZIP and its checksum.
          if (( ${#assets[@]} != 2 )); then
            echo "::error::Expected exactly two release assets, found ${#assets[@]}."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists. Increase the project version before publishing another release."
            exit 1
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release candidate commit is invalid."
            exit 1
          fi

          if ! tag_commit="$(gh api --paginate "repos/$GH_REPO/tags?per_page=100" \
            --jq 'if type != "array" then error("Invalid tag response") else .[] end | if type != "object" or (.name | type) != "string" or (.name | length) == 0 or (.commit | type) != "object" then error("Invalid tag response") else . end | . as $tag | .commit.sha | if type == "string" and length == 40 and test("^[0-9a-f]+$") then select($tag.name == env.TAG_NAME) else error("Invalid tag commit") end')"; then
            echo "::error::The remote release tag could not be checked safely."
            exit 1
          fi

          if [[ -n "$tag_commit" ]]; then
            if [[ ! "$tag_commit" =~ ^[0-9a-f]{40}$ || "$tag_commit" != "$TARGET_SHA" ]]; then
              echo "::error::The remote release tag does not uniquely match the candidate commit."
              exit 1
            fi
          elif [[ "$AUTO_RELEASE" != "true" ]]; then
            echo "::error::The release tag is missing from the remote repository."
            exit 1
          fi

          if [[ "$AUTO_RELEASE" == "true" ]]; then
            gh release create "$TAG_NAME" "${assets[@]}" \
              --target "$TARGET_SHA" \
              --title "Syrius Extension ${TAG_NAME#v}" \
              --generate-notes
            exit 0
          fi

          gh release create "$TAG_NAME" "${assets[@]}" \
            --title "Syrius Extension ${TAG_NAME#v}" \
            --generate-notes \
            --verify-tag
